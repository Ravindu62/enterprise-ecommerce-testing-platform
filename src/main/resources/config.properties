#====================================================
# Application Configuration
#====================================================

# Environment
environment=qa


# Application URL
base.url=https://demo.mahocommerce.com/


#====================================================
# Browser Configuration
#====================================================

browser=chrome

headless=false

maximize=true


#====================================================
# Selenium Configuration
#====================================================

implicit.wait=0

explicit.wait=15

page.load.timeout=30

script.timeout=30


#====================================================
# Screenshot Configuration
#====================================================

screenshot.on.failure=true

screenshot.path=./screenshots/


#====================================================
# Test Execution Configuration
#====================================================

retry.count=2

parallel.execution=false

thread.count=2


#====================================================
# API Configuration
#====================================================

api.base.url=https://demo.mahocommerce.com/rest/


#====================================================
# Database Configuration
#====================================================

db.enabled=false

db.url=jdbc:mysql://localhost:3306/mahocommerce

db.username=root

db.password=password


#====================================================
# Test Data
#====================================================

test.data.path=src/test/resources/testdata/


#====================================================
# Reports
#====================================================

allure.results.path=target/allure-results

extent.report.path=target/reports/extent-report.html